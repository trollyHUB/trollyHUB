<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="950" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: 1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #94a3b8; letter-spacing: 0.5px; }
    .code-tag { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Card Background with Rounded Borders -->
  <rect x="2" y="2" width="946" height="256" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  <rect x="2" y="2" width="946" height="256" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="120" cy="40" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="850" cy="220" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="50" r="100" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Tech Geometric Hexagons & Shapes -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <polygon points="860,60 885,75 885,105 860,120 835,105 835,75" />
    <polygon points="895,110 920,125 920,155 895,170 870,155 870,125" />
    <polygon points="825,130 850,145 850,175 825,190 800,175 800,145" />
    <line x1="860" y1="120" x2="870" y2="125" />
    <line x1="850" y1="145" x2="870" y2="145" />
  </g>

  <!-- Top Accent Glowing Border Line -->
  <line x1="60" y1="2" x2="890" y2="2" stroke="url(#glowLine)" stroke-width="3" />

  <!-- Left Terminal Prefix Indicator -->
  <g transform="translate(50, 48)">
    <text class="code-tag" x="0" y="0">&lt;developer&gt; focus: "Software Engineering &amp; Venture Building" &lt;/developer&gt;</text>
  </g>

  <!-- Main Name Header with Gradient Overlay -->
  <text class="title" x="50" y="105">
    TOLEGEN MANASSOV
  </text>

  <!-- Dynamic Underline -->
  <rect x="50" y="120" width="140" height="4" rx="2" fill="url(#cyanBlue)" />
  <circle cx="202" cy="122" r="4" fill="#38bdf8" />
  <circle cx="216" cy="122" r="2.5" fill="#6366f1" />

  <!-- Subtitle / Bio -->
  <text class="subtitle" x="50" y="156">
    Full-Stack Software Engineer • Modern Products • AI-Agentic Systems • Future Founder
  </text>

  <!-- Interactive / Aesthetic Pill Badges -->
  <!-- Badge 1: Location -->
  <g transform="translate(50, 185)">
    <rect width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text class="badge-text" x="34" y="20.5">Astana, Kazakhstan 🇰🇿</text>
  </g>

  <!-- Badge 2: Future Founder -->
  <g transform="translate(235, 185)">
    <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="badge-text" x="16" y="20.5">🚀 Future Tech Founder</text>
  </g>

  <!-- Badge 3: Modern Web & Desktop Apps -->
  <g transform="translate(415, 185)">
    <rect width="235" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="badge-text" x="16" y="20.5">⚡ Modern Web &amp; Desktop Apps</text>
  </g>

  <!-- Badge 4: AI & Agentic Systems -->
  <g transform="translate(660, 185)">
    <rect width="235" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="badge-text" x="16" y="20.5">🧠 AI-Agentic &amp; Smart Systems</text>
  </g>
</svg>
